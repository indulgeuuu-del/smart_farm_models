name: repository-checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install CI dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements/ci.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Compile maintained Python modules
        run: python -m compileall -q scripts tests
      - name: Verify public repository artifacts
        run: python scripts/release/verify_public_repository.py --repo-root .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
