name: repository-checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install CI dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements/ci.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Validate pinned dependency profiles
        run: python scripts/common/check_requirements_profiles.py
      - name: Compile maintained Python modules
        run: python -m compileall -q scripts tests
      - name: Check supported CLI help
        run: python scripts/common/check_supported_cli.py --repo-root . --python-executable python
      - name: Verify public repository artifacts
        run: python scripts/release/verify_public_repository.py --repo-root .
      - name: Run dependency-light public smoke check
        run: python scripts/common/smoke_public_repository.py --repo-root .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
